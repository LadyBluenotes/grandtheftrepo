name: Sync upstream

# Nightly: merge pingdotgg/t3code main into this fork.
# - A clean merge is pushed straight to TARGET_BRANCH.
# - A conflicting merge force-pushes upstream's head to SYNC_BRANCH, opens (or
#   refreshes) a pull request into TARGET_BRANCH, and hands the conflict to the
#   Copilot coding agent through an issue when SYNC_TOKEN is set and the agent
#   is enabled on the repository. The next clean run closes both.
#
# Pushes made with the default GITHUB_TOKEN do not start other workflows, so CI
# will not run on a nightly merge, and the default token cannot assign Copilot.
# Add a repository secret SYNC_TOKEN (a fine-grained PAT with contents: write,
# pull-requests: write and issues: write) to turn both on; the job falls back to
# GITHUB_TOKEN when the secret is absent.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: pingdotgg/t3code
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH: sync/upstream
  CONFLICT_LABEL: sync-conflict

jobs:
  sync:
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-24.04
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      # The checkout gains an `upstream` remote, and gh would otherwise resolve
      # the parent repository as the base for every pr and issue command.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge
        id: merge
        run: |
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${upstream_sha}" HEAD; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already contains ${UPSTREAM_REPO}@${upstream_sha}"
            exit 0
          fi
          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}" \
              -m "chore: sync upstream ${UPSTREAM_REPO}@${upstream_sha:0:12}"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sort > "${RUNNER_TEMP}/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "Conflicts:"
            cat "${RUNNER_TEMP}/conflicts.txt"
          fi

      - name: Push merge
        if: steps.merge.outputs.result == 'merged'
        run: git push origin "HEAD:${TARGET_BRANCH}"

      - name: Open or refresh conflict pull request
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          # Never force: once Copilot or a person has pushed a resolution to the
          # branch, a non-fast-forward push is rejected and that work survives.
          git push origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${SYNC_BRANCH}" \
            || echo "${SYNC_BRANCH} carries commits beyond upstream; left as is."
          {
            echo "Nightly sync of \`${UPSTREAM_REPO}\` at \`${{ steps.merge.outputs.upstream_sha }}\` did not merge automatically."
            echo
            echo "Conflicting files:"
            echo
            sed 's/^/- `/; s/$/`/' "${RUNNER_TEMP}/conflicts.txt"
            echo
            echo "Resolve the conflicts on this pull request, or merge \`${SYNC_BRANCH}\` into \`${TARGET_BRANCH}\` locally and push. The next nightly run closes this once \`${TARGET_BRANCH}\` contains upstream."
          } > "${RUNNER_TEMP}/body.md"
          number="$(gh pr list --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh pr create --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" \
              --title "chore: sync upstream ${UPSTREAM_REPO} (conflicts)" \
              --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr edit "${number}" --body-file "${RUNNER_TEMP}/body.md"
          fi

      - name: Hand the conflict to Copilot
        if: steps.merge.outputs.result == 'conflict' && env.SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          name="${GITHUB_REPOSITORY#*/}"
          bot="$(gh api graphql -f owner="${owner}" -f name="${name}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                  nodes { login ... on Bot { id } }
                }
              }
            }' --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')"
          if [ -z "${bot}" ]; then
            echo "The Copilot coding agent is not enabled on this repository; the conflict pull request waits for a person."
            exit 0
          fi
          gh label create "${CONFLICT_LABEL}" --force --description "Upstream sync needs conflict resolution" >/dev/null
          existing="$(gh issue list --label "${CONFLICT_LABEL}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "Conflict issue #${existing} is already open."
            exit 0
          fi
          {
            echo "Merge branch \`${SYNC_BRANCH}\` (upstream \`${UPSTREAM_REPO}\` main at \`${{ steps.merge.outputs.upstream_sha }}\`) into \`${TARGET_BRANCH}\` and resolve the conflicts."
            echo
            echo "Rules:"
            echo "- Keep every line listed in \`docs/fork.md\` under \"Upstream seams\"; those lines are this fork's."
            echo "- Everywhere else take upstream's side."
            echo "- Regenerate \`apps/web/src/routeTree.gen.ts\` by running the web build instead of editing it."
            echo "- Typecheck \`apps/server\`, \`packages/contracts\` and \`apps/web\` before opening the pull request."
            echo
            echo "Conflicting files:"
            echo
            sed 's/^/- `/; s/$/`/' "${RUNNER_TEMP}/conflicts.txt"
          } > "${RUNNER_TEMP}/issue.md"
          url="$(gh issue create --label "${CONFLICT_LABEL}" --title "Resolve upstream sync conflicts" --body-file "${RUNNER_TEMP}/issue.md")"
          number="${url##*/}"
          issue_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" --jq .node_id)"
          gh api graphql -f id="${issue_id}" -f bot="${bot}" -f query='
            mutation($id: ID!, $bot: ID!) {
              replaceActorsForAssignable(input: { assignableId: $id, actorIds: [$bot] }) {
                assignable { ... on Issue { number } }
              }
            }' >/dev/null
          echo "Assigned Copilot to issue #${number}."

      - name: Close stale conflict pull request and issue
        if: steps.merge.outputs.result != 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          number="$(gh pr list --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh pr close "${number}" --delete-branch \
              --comment "Upstream now merges cleanly into \`${TARGET_BRANCH}\`. Closing."
          fi
          for issue in $(gh issue list --label "${CONFLICT_LABEL}" --state open --json number --jq '.[].number'); do
            gh issue close "${issue}" --comment "Upstream now merges cleanly into \`${TARGET_BRANCH}\`. Closing."
          done
